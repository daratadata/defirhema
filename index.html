<title>Défi Rhema</title>
<style>
:root{--bg:#eaf3ff;--card:#fff;--ink:#0f2250;--mute:#5b6b8f;--navy:#12307a;--gold:#d9a526;--gold2:#f3cf5a;--line:#d5e2f7;--ok:#1f9d63;--no:#c8452f;--h:#2a6fdb;--f:#d6498a}
*{box-sizing:border-box}

header{background:linear-gradient(135deg,#0c235e,#1b4bb0);color:#fff;border-bottom:3px solid var(--gold);padding:10px 16px}

.btn.alt{background:var(--navy);color:#fff}.btn.ghost{background:rgba(255,255,255,.18);color:#fff;padding:7px 12px}
:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}

textarea{min-height:80px}
.chip{display:inline-block;padding:6px 12px;border-radius:99px;background:rgba(18,48,122,.1);font:600 14px "Trebuchet MS",sans-serif;margin:3px}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.d{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;font:600 14px sans-serif;color:var(--ink)}
.d.cur{outline:3px solid var(--navy)}.d.ok{background:var(--gold2);border-color:var(--gold)}.d.half{background:#fff3c4}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:15px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.bar{height:12px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}

.chart .h{background:var(--h)}.chart .f{background:var(--f)}
.cb{width:24px;height:24px;margin:0;accent-color:#1f9d63}
.msg{padding:10px;border-radius:9px;background:#fff3c4;margin:8px 0}.err{background:#fde2dc}
.hide{display:none}button.chip{border:0;cursor:pointer;color:var(--ink)}main{padding-bottom:90px}.mini{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#0c235e;color:#fff;border-top:3px solid var(--gold);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap}.mini .btn{padding:7px 12px}.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:12px 0}.tile{border-radius:14px;padding:14px 6px;text-align:center;background:linear-gradient(160deg,#1b4bb0,#0c235e);color:#fff;font:600 14px sans-serif}.tile.spk{box-shadow:0 0 0 3px var(--gold2)}.av{width:44px;height:44px;border-radius:50%;background:var(--gold2);color:#0c235e;display:grid;place-items:center;font-weight:800;margin:0 auto 6px}.login{max-width:440px;margin:24px auto}.login img{width:100%;border-radius:16px;margin-bottom:12px}
</style></head><body>
<header><div class="top"><img src="logo.jpg" alt="Logo Défi Rhema"><div><b>DÉFI RHEMA</b><small>Ta Parole, notre force ! (Luc 11,28)</small></div><span class="sp"></span><span id="who" class="ui"></span><button class="btn ghost hide" id="out" data-a="out">Sortir</button></div><nav id="nav"></nav></header>
<main id="app"></main>
<div id="mini" class="mini hide"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<script src="config.js"></script>
<script>
var BOOKS=[["Matthieu",28],["Marc",16],["Luc",24],["Jean",21],["Actes",28],["Romains",16],["1 Corinthiens",16],["2 Corinthiens",13],["Galates",6],["Éphésiens",6],["Philippiens",4],["Colossiens",4],["1 Thessaloniciens",5],["2 Thessaloniciens",3],["1 Timothée",6],["2 Timothée",4],["Tite",3],["Philémon",1],["Hébreux",13],["Jacques",5],["1 Pierre",5],["2 Pierre",3],["1 Jean",5],["2 Jean",1],["3 Jean",1],["Jude",1],["Apocalypse",22]];
var ALL=[];BOOKS.forEach(function(b){for(var i=1;i<=b[1];i++)ALL.push([b[0],i])});
function plan(d){var a=Math.floor((d-1)*ALL.length/30),z=Math.floor(d*ALL.length/30),o=[],c=null;for(var i=a;i<z;i++){var x=ALL[i];if(c&&c.b==x[0])c.e=x[1];else{c={b:x[0],s:x[1],e:x[1]};o.push(c)}}return o.map(function(x){return x.b+" "+(x.s==x.e?x.s:x.s+"–"+x.e)}).join(" ; ")}
var sb=window.supabase.createClient(CFG.url,CFG.key),$=function(i){return document.getElementById(i)};

var U=null,P=null,start=null,tab="today",day=1,mode="in",note="",D={profiles:[],readings:[],att:[]};
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
function today(){if(!start)return 1;var n=Math.floor((Date.now()-new Date(start+"T00:00:00"))/864e5)+1;return Math.min(30,Math.max(1,n))}
function dlabel(d){if(!start)return"Date à définir";var t=new Date(start+"T12:00:00");t.setDate(t.getDate()+d-1);return t.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}
async function load(){
 var s=await sb.from("app_settings").select("start_date").eq("id",1).single();start=s.data?s.data.start_date:null;
 var p=await sb.from("profiles").select("*");D.profiles=p.data||[];P=D.profiles.find(function(x){return x.id==U.id});
 D.readings=(await sb.from("user_readings").select("*")).data||[];D.att=(await sb.from("attendance").select("*")).data||[];
 day=today();if(!P)return;if(P.role!="admin"&&["dash","point","people","cfg"].indexOf(tab)>-1)tab="today"}

function tabs(){var t=[["today","Aujourd’hui"],["bible","Bible"],["path","Mon parcours"],["call","Rencontre"]];if(isA())t=t.concat([["dash","Tableau de bord"],["point","Pointage"],["people","Participants"],["cfg","Réglages"]]);
 $("nav").innerHTML=U?t.map(function(x){return'<button class="'+(tab==x[0]?"on":"")+'" data-tab="'+x[0]+'">'+x[1]+"</button>"}).join(""):"";
 $("who").textContent=P?P.full_name+(isA()?" (admin)":""):"";$("out").className="btn ghost"+(U?"":" hide")}
function authView(){var up=mode=="up";return'<div class="login card"><img src="logo.jpg" alt="Défi Rhema"><h2>'+(up?"Créer mon compte":"Connexion")+'</h2>'+(note?'<div class="msg">'+esc(note)+"</div>":"")+
 (up?'<label>Nom complet<input id="fn" autocomplete="name"></label><label>Genre<select id="fg"><option value="homme">Homme</option><option value="femme">Femme</option></select></label><label>Pays<input id="fc" list="pays" value="Côte d’Ivoire"><datalist id="pays"><option>Côte d’Ivoire<option>Bénin<option>Togo<option>Sénégal<option>Cameroun<option>Mali<option>Gabon<option>RD Congo<option>France<option>Canada</datalist></label><label>Ville<input id="fv"></label>':"")+
 '<label>Contact (téléphone avec indicatif, ex. 22507000000)<input id="em" type="tel" inputmode="tel" autocomplete="tel"></label><label>Mot de passe (6 caractères minimum)<input id="pw" type="password" autocomplete="'+(up?"new":"current")+'-password"></label><button class="btn" data-a="'+(up?"signup":"login")+'">'+(up?"Créer mon compte":"Me connecter")+'</button> <button class="btn alt" data-a="mode">'+(up?"J’ai déjà un compte":"S’inscrire")+"</button></div>"}
function todayView(){var r=myRead(U.id,day),a=att(U.id,day)||{},v=a.validated;
 return dayPick()+'<div class="card"><small>'+esc(dlabel(day))+"</small><h2 style='margin:4px 0'>Jour "+day+" sur 30</h2><p class='lbl'>Lecture proposée (touchez un chapitre pour le lire)</p>"+chapChips()+
 (r&&r.assigned_by&&r.assigned_by!=U.id?"<p class='msg'>Lecture qui vous est attribuée : <b>"+esc(r.reading)+"</b></p>":"")+
 '<label>Ma lecture du jour (modifiable)<input id="rd" value="'+esc(r&&r.reading||plan(day))+'"></label><label>Ce que je veux partager ou prier aujourd’hui<textarea id="it">'+esc(r&&r.intention||"")+'</textarea></label><button class="btn alt" data-a="saveread">Enregistrer</button></div>'+
 '<div class="card"><label style="display:flex;gap:12px;align-items:center"><input class="cb" type="checkbox" id="done" data-a="self" '+(a.self_done?"checked":"")+(v?" disabled":"")+'><span>J’ai lu et j’ai participé à la prière</span></label>'+(v?'<p class="msg" style="background:#d9f5e6">Présence validée par l’administrateur ✓</p>':"<small>L’administrateur validera votre présence.</small>")+"</div>"}
function pathView(){var n=D.att.filter(function(a){return a.user_id==U.id&&a.validated}).length;return dayPick()+'<div class="card"><b class="ui">Ma progression</b><div class="bar" style="margin:10px 0"><i style="width:'+n/30*100+'%"></i></div><small>'+n+" jour(s) validés sur 30</small></div>"}
function pct(a,b){return b?Math.round(a/b*100):0}
function dashView(){var ps=D.profiles.filter(function(p){return p.role!="admin"||true}),N=ps.length,H=ps.filter(function(p){return p.gender=="homme"}).length,F=ps.filter(function(p){return p.gender=="femme"}).length;
 var g=function(id){var p=D.profiles.find(function(x){return x.id==id});return p?p.gender:""};
 var vd=D.att.filter(function(a){return a.day==day&&a.validated}),vh=vd.filter(function(a){return g(a.user_id)=="homme"}).length,vf=vd.filter(function(a){return g(a.user_id)=="femme"}).length,sd=D.att.filter(function(a){return a.day==day&&a.self_done}).length;
 var chart="";for(var d=1;d<=30;d++){var x=D.att.filter(function(a){return a.day==d&&a.validated}),h=x.filter(function(a){return g(a.user_id)=="homme"}).length,f=x.filter(function(a){return g(a.user_id)=="femme"}).length,m=Math.max(N,1);chart+='<div title="Jour '+d+" : "+h+" H, "+f+' F"><i class="f" style="height:'+f/m*100+'px"></i><i class="h" style="height:'+h/m*100+'px"></i></div>'}
 var rows=ps.map(function(p){var v=D.att.filter(function(a){return a.user_id==p.id&&a.validated}).length;return{p:p,v:v}}).sort(function(a,b){return b.v-a.v});
 var by={};ps.forEach(function(p){var c=p.country||"?";by[c]=by[c]||{n:0,v:0};by[c].n++});D.att.filter(function(a){return a.validated}).forEach(function(a){var p=D.profiles.find(function(x){return x.id==a.user_id});if(p)by[p.country||"?"].v++});
 var cum=D.att.filter(function(a){return a.validated}).length;
 return dayPick()+'<div class="grid"><div class="card"><div class="stat">'+N+'</div><div class="lbl">inscrits ('+H+" H · "+F+' F)</div></div><div class="card"><div class="stat">'+vd.length+'</div><div class="lbl">validés au jour '+day+" ("+vh+" H · "+vf+' F)</div></div><div class="card"><div class="stat">'+pct(vd.length,N)+' %</div><div class="lbl">présence du jour</div></div><div class="card"><div class="stat">'+sd+'</div><div class="lbl">lectures déclarées</div></div><div class="card"><div class="stat">'+pct(cum,N*30)+' %</div><div class="lbl">présence cumulée</div></div></div>'+
 '<div class="card"><b class="ui">Présence validée par jour</b> <small><span style="color:var(--h)">■</span> hommes <span style="color:var(--f)">■</span> femmes</small><div class="chart" style="margin-top:10px">'+chart+'</div></div>'+
 '<div class="card"><b class="ui">Cumul par participant</b><div class="wrap"><table><tr><th>Nom</th><th>Genre</th><th>Pays</th><th>Jours validés</th><th>Taux</th></tr>'+rows.map(function(r){return"<tr><td>"+esc(r.p.full_name)+"</td><td>"+esc(r.p.gender||"")+"</td><td>"+esc(r.p.country||"")+"</td><td>"+r.v+"/30</td><td>"+pct(r.v,30)+" %</td></tr>"}).join("")+'</table></div></div>'+
 '<div class="card"><b class="ui">Par pays</b>'+Object.keys(by).map(function(c){return'<div style="margin:8px 0"><span class="lbl">'+esc(c)+" · "+by[c].n+' inscrits · '+by[c].v+' présences validées</span><div class="bar"><i style="width:'+pct(by[c].v,by[c].n*30)+'%"></i></div></div>'}).join("")+"</div>"}
function pointView(){return dayPick()+'<div class="card"><h2>Pointage — jour '+day+'</h2><small>Cochez les personnes présentes pour valider leur présence.</small><div class="wrap"><table><tr><th>Nom</th><th>Genre</th><th>Pays</th><th>Contact</th><th>Déclaré</th><th>Présent</th></tr>'+D.profiles.map(function(p){var a=att(p.id,day)||{};return"<tr><td>"+esc(p.full_name)+"</td><td>"+esc(p.gender||"")+"</td><td>"+esc(p.country||"")+"</td><td>"+esc(p.contact||"")+"</td><td>"+(a.self_done?"✓":"")+'</td><td><input class="cb" type="checkbox" data-a="valid" data-u="'+p.id+'" '+(a.validated?"checked":"")+"></td></tr>"}).join("")+"</table></div></div>"}
function peopleView(){return dayPick()+'<div class="card"><h2>Attribuer une lecture — jour '+day+'</h2><label>Participant<select id="au"><option value="all">Tous les participants</option>'+D.profiles.map(function(p){return'<option value="'+p.id+'">'+esc(p.full_name)+"</option>"}).join("")+'</select></label><label>Lecture<input id="ar" value="'+esc(plan(day))+'"></label><button class="btn" data-a="assign">Attribuer</button></div><div class="card"><b class="ui">Lectures attribuées au jour '+day+'</b><div class="wrap"><table>'+D.profiles.map(function(p){var r=myRead(p.id,day);return"<tr><td>"+esc(p.full_name)+"</td><td>"+esc(r?r.reading:"(plan par défaut)")+"</td><td>"+esc(r&&r.intention||"")+"</td></tr>"}).join("")+"</table></div></div>"}
function cfgView(){return'<div class="card"><h2>Réglages</h2><label>Date de début du défi<input type="date" id="st" value="'+esc(start||"")+'"></label><button class="btn" data-a="savestart">Enregistrer</button> <small>Vide tant que la date n’est pas choisie.</small></div>'}
function render(){tabs();var v;if(!U)v=authView();else if(!P)v='<div class="card">Chargement du profil…</div>';else v=({bible:bibleView,call:callView,today:todayView,path:pathView,dash:dashView,point:pointView,people:peopleView,cfg:cfgView})[tab]();$("app").innerHTML=v;drawMini();if(tab=="call"&&CS=="live")drawCall();if(tab=="bible")loadChap()}
function mail(){return"c"+$("em").value.replace(/\D/g,"")+"@rhema.app"}
var room=null,CS="idle";
function callView(){var h='<div class="card"><h2>Rencontre de prière</h2><small>Appel audio uniquement · autorisez le micro quand le navigateur le demande</small>';
 if(CS!="live")h+='<p>Rejoignez la prière en direct.</p><button class="btn" data-a="join" '+(CS=="connecting"?"disabled":"")+'>'+(CS=="connecting"?"Connexion…":"Rejoindre la prière")+"</button>";
 else h+='<p class="ui"><b id="cn"></b></p><div class="tiles" id="tl"></div><p style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn alt" data-a="mic" id="micb"></button>'+(isA()?'<button class="btn alt" data-a="muteall">Couper tous les micros</button>':"")+'<button class="btn" style="background:var(--no);color:#fff" data-a="leave">Quitter</button></p>';
 return h+"</div>"}
function refresh(){drawMini();drawCall()}
function drawMini(){var m=$("mini");if(!m)return;if(CS!="live"||!room||tab=="call"){m.className="mini hide";return}var lp=room.localParticipant;m.className="mini";m.innerHTML="<span class='ui'>🔊 Appel en cours · "+(room.remoteParticipants.size+1)+' connecté(s)</span><span class="sp"></span><button class="btn" data-a="mic">'+(lp.isMicrophoneEnabled?"Couper mon micro":"Activer mon micro")+'</button><button class="btn alt" data-tab="call">Retour à l’appel</button>'}
function drawCall(){if(!room||!$("tl"))return;var lp=room.localParticipant,ps=[lp].concat(Array.from(room.remoteParticipants.values()));$("cn").textContent=ps.length+" connecté(s)";
 $("tl").innerHTML=ps.map(function(p){var n=p.name||p.identity;return'<div class="tile'+(p.isSpeaking?" spk":"")+'"><div class="av">'+esc(n.charAt(0))+"</div>"+esc(n)+(p==lp?" (moi)":"")+(p.isMicrophoneEnabled?"":" 🔇")+(isA()&&p!=lp&&p.isMicrophoneEnabled?'<br><button class="btn" style="padding:4px 8px;font-size:12px;margin-top:6px" data-a="mute" data-id="'+esc(p.identity)+'">Couper</button>':"")+"</div>"}).join("");$("micb").textContent=lp.isMicrophoneEnabled?"Couper le micro":"Activer le micro"}
var BV={ver:"tob",vers:[{id:"tob",name:"TOB — Traduction œcuménique de la Bible"}],book:0,ch:1,cache:{}};
fetch("bible/versions.json").then(function(r){return r.json()}).then(function(v){BV.vers=v;if(tab=="bible")render()}).catch(function(){});
function chaps(d){return ALL.slice(Math.floor((d-1)*ALL.length/30),Math.floor(d*ALL.length/30))}
function bidx(n){for(var i=0;i<BOOKS.length;i++)if(BOOKS[i][0]==n)return i;return 0}
function chapChips(){return chaps(day).map(function(c){return'<button class="chip" data-a="open" data-b="'+esc(c[0])+'" data-c="'+c[1]+'">'+esc(c[0])+" "+c[1]+"</button>"}).join("")}
function bibleView(){var co="";for(var i=1;i<=BOOKS[BV.book][1];i++)co+='<option'+(i==BV.ch?" selected":"")+">"+i+"</option>";
 return'<div class="card"><h2>Bible</h2><small>Vous pouvez lire pendant l’appel : le son continue.</small><p class="lbl">Lecture du jour '+day+"</p>"+chapChips()+'</div><div class="card"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))"><label>Version<select id="bv">'+BV.vers.map(function(v){return'<option value="'+v.id+'"'+(v.id==BV.ver?" selected":"")+">"+esc(v.name)+"</option>"}).join("")+'</select></label><label>Livre<select id="bk">'+BOOKS.map(function(b,i){return'<option value="'+i+'"'+(i==BV.book?" selected":"")+">"+esc(b[0])+"</option>"}).join("")+'</select></label><label>Chapitre<select id="bc">'+co+'</select></label></div><h3 id="bh"></h3><div id="bt" style="font-size:18px;line-height:1.7"></div><p style="display:flex;gap:10px"><button class="btn alt" data-a="bprev">← Précédent</button><button class="btn alt" data-a="bnext">Suivant →</button></p></div>'}
async function loadChap(){var el=$("bt");if(!el)return;$("bh").textContent=BOOKS[BV.book][0]+" "+BV.ch;el.textContent="Chargement…";var k=BV.ver+"/"+BV.book;
 try{if(!BV.cache[k]){var r=await fetch("bible/"+k+".json");if(!r.ok)throw 0;BV.cache[k]=await r.json()}var v=BV.cache[k][BV.ch];if(!v)throw 0;el.innerHTML=v.map(function(t,i){return'<p style="margin:6px 0"><sup>'+(i+1)+"</sup> "+esc(t)+"</p>"}).join("")}
